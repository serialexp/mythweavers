packages:
  - 'apps/*'
  - 'packages/*'
catalog:
  zod: ^4.1.5
  "@types/node": ^24.10.0
# Build/install-script policy (pnpm v11 `allowBuilds`). pnpm v11
# hard-errors (ERR_PNPM_IGNORED_BUILDS) on any dependency with a build
# script that isn't explicitly classified here. `false` = acknowledged,
# scripts NOT run — which preserves prior behavior: these all work via
# prebuilt platform packages or on-demand engine downloads.
allowBuilds:
  "@biomejs/biome": false
  "@parcel/watcher": false
  "@prisma/client": false
  "@prisma/engines": false
  "@swc/core": false
  esbuild: false
  lzma-native: false
  prisma: false
  sharp: false
overrides:
  "@types/node": "catalog:"
  happy-dom: ">=20.0.0"
  form-data: ">=4.0.4"
  cookie: ">=0.7.0"
  path-to-regexp: ">=8.0.0"
  tmp: ">=0.2.4"
  fastify: ">=5.3.2"
  axios: ">=1.12.0"
  lodash: ">=4.17.21"
  node-forge: ">=1.3.2"
  glob: ">=11.1.0"
  jws: ">=4.0.1"
  "@modelcontextprotocol/sdk": ">=1.24.0"
  "@trpc/server": ">=11.1.1"
  playwright: ">=1.55.1"
  mdast-util-to-hast: ">=13.2.1"
  body-parser: ">=2.2.1"
  brace-expansion: ">=2.0.2"
  js-yaml: ">=4.1.1"
